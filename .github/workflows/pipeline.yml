name: Pipeline diário e pautas

# Agendamento feito pelo n8n (workflow "Agendador – Monitoramento de Proposições"),
# que chama workflow_dispatch às 07h17 (completo) e 10h/14h (pautas) de São Paulo.
# O modo "inclusao" é disparado pelo n8n "Inclusão manual de proposições" quando a
# responsável inclui uma proposição pela planilha.
# O cron nativo do GitHub foi removido porque atrasava ou descartava disparos.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: Tipo de atualização
        type: choice
        options:
          - completo
          - pautas
          - inclusao
        default: completo
      somente_notificar_n8n:
        description: Reenviar ao n8n usando os dados já carregados, sem executar nova carga
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monitoramento-proposicoes-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment: DATABASE_URL
    timeout-minutes: 120
    env:
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      PGCONNECT_TIMEOUT: "15"
      PGSSLMODE: require
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Instalar dependências
        run: python -m pip install -r requirements.lock

      - name: Verificar ambiente e executar atualização
        id: carga
        if: ${{ inputs.somente_notificar_n8n != true }}
        # Abaixo do timeout do job: estourar o tempo vira falha deste passo (e dispara
        # o aviso), em vez de cancelar o job inteiro em silêncio.
        timeout-minutes: 110
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          MODO: ${{ inputs.modo }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure o secret DATABASE_URL no environment usado por este job."
            exit 1
          fi
          python src/notify_n8n.py --check
          python src/check_environment.py
          case "$MODO" in
            pautas) python src/pipeline_pautas.py ;;
            inclusao) python src/pipeline_inclusao.py ;;
            *) python src/pipeline.py ;;
          esac

      - name: Notificar atualização ao n8n
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          MODO: ${{ inputs.modo }}
        run: python src/notify_n8n.py --modo "$MODO"

      # Sem isto, uma carga que falha simplesmente não gera e-mail e ninguém percebe.
      # Só quando a CARGA falhou: se só a notificação falhou, o n8n pode já ter
      # mandado o e-mail normal, e um aviso de falha confundiria.
      - name: Avisar falha ao n8n
        if: ${{ failure() && steps.carga.outcome == 'failure' }}
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          MODO: ${{ inputs.modo }}
        run: python src/notify_n8n.py --modo "$MODO" --status falha
